<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Wedding photo placeholder</title>
  <desc id="desc">Decorative placeholder image with soft gradients and frame lines.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d7e7de"/>
      <stop offset="50%" stop-color="#f4e8d8"/>
      <stop offset="100%" stop-color="#d8d6e8"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.4" fill="#ffffff" fill-opacity="0.36"/>
    </pattern>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <rect width="1400" height="900" fill="url(#dots)"/>
  <rect x="120" y="100" width="1160" height="700" fill="none" stroke="#ffffff" stroke-opacity="0.68" stroke-width="2"/>
  <rect x="180" y="160" width="1040" height="580" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
  <text x="700" y="430" text-anchor="middle" font-family="Georgia, serif" font-size="58" fill="#ffffff" fill-opacity="0.96">
    Photo Placeholder
  </text>
  <text x="700" y="485" text-anchor="middle" font-family="Verdana, sans-serif" font-size="24" letter-spacing="6" fill="#ffffff" fill-opacity="0.88">
    REPLACE WITH YOUR IMAGE
  </text>
</svg>

